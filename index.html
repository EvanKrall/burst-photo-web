<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>HDR+ Web — Burst Photo PoC</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111418; color: #d8dde4; margin: 0 auto; max-width: 960px; padding: 2rem;
    }
    h1 { font-weight: 600; font-size: 1.4rem; margin: 0 0 0.25rem; }
    .subtitle { color: #8a929c; margin-bottom: 1.5rem; }
    #drop {
      border: 2px dashed #3a4149; border-radius: 12px; padding: 2.5rem;
      text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
    }
    #drop.hover { border-color: #4a9eff; background: #16202b; }
    #drop strong { color: #4a9eff; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center;
      margin: 1.25rem 0; padding: 1rem; background: #181d24; border-radius: 12px;
    }
    .controls label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; color: #8a929c; }
    select, button {
      background: #222a33; color: #d8dde4; border: 1px solid #3a4149;
      border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.9rem;
    }
    button.primary { background: #1c4e80; border-color: #2b6cb0; cursor: pointer; font-weight: 600; }
    button.primary:hover { background: #245d9a; }
    button.primary:disabled { opacity: 0.4; cursor: default; }
    #progressWrap { display: none; margin: 1rem 0; }
    #progressBar { height: 8px; background: #222a33; border-radius: 4px; overflow: hidden; }
    #progressFill { height: 100%; width: 0%; background: #4a9eff; transition: width .15s; }
    #log {
      background: #0c0e11; border: 1px solid #22272e; border-radius: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.75rem;
      padding: 0.75rem; height: 180px; overflow-y: auto; white-space: pre-wrap;
    }
    #result { margin-top: 1.5rem; display: none; }
    #canvas { max-width: 100%; border-radius: 8px; image-rendering: auto; }
    #download {
      display: inline-block; margin-top: 0.75rem; background: #1c4e80; color: #fff;
      padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 600;
    }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>HDR+ Web</h1>
  <p class="subtitle">
    Proof-of-concept web port of <a href="https://github.com/martin-marek/hdr-plus-swift" style="color:#4a9eff">Burst Photo</a>:
    HTML5 + flashraw (RAW decode) + WebGPU (align &amp; merge), spatial-domain merge, Bayer sensors.
  </p>

  <div id="drop">
    Drop <strong>RAW burst files</strong> here (.dng, .nef, .arw, .cr3, .raf, … — same camera &amp; size)<br>
    or click to choose files
    <input id="fileInput" type="file" accept=".dng,.nef,.nrw,.arw,.srf,.sr2,.arq,.cr2,.cr3,.crw,.raf,.rwl,.rw2,.orf,.ori,.pef,.srw,.mrw,.iiq,.mos,.3fr,.fff,.kdc,.dcr,.dcs,.erf,.mef,.x3f,.ari" multiple hidden>
  </div>

  <div class="controls">
    <label>Noise reduction
      <select id="noiseReduction">
        <option>0</option><option>4</option><option>8</option><option>12</option>
        <option selected>13</option><option>16</option><option>20</option><option>23</option>
      </select>
    </label>
    <label>Tile size
      <select id="tileSize">
        <option value="16">Small (16)</option>
        <option value="32" selected>Medium (32)</option>
        <option value="64">Large (64)</option>
      </select>
    </label>
    <label>Search distance
      <select id="searchDistance">
        <option value="128">Small (128)</option>
        <option value="64" selected>Medium (64)</option>
        <option value="32">Large (32)</option>
      </select>
    </label>
    <button id="process" class="primary" disabled>Process burst</button>
  </div>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressText" style="font-size:0.8rem;color:#8a929c;margin-top:0.35rem;"></div>
  </div>
  <pre id="log"></pre>

  <div id="result">
    <canvas id="canvas"></canvas>
    <br>
    <a id="download" download="merged.dng">Download merged.dng</a>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
